<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Corporate Meeting Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <div class="header">
            <span class="eyebrow">MEETING ECONOMICS</span>
            <h1>Corporate Meeting Calculator</h1>
            <p>Find out exactly how much money that meeting just vaporized.</p>
        </div>

        <div class="input-group">
            <label for="people">People in the meeting</label>
            <input type="number" id="people" value="10">
        </div>

        <div class="input-group">
            <label for="salary">Average annual salary</label>
            <input type="number" id="salary" value="100000">
        </div>

        <div class="input-group">
            <label for="minutes">Meeting length (minutes)</label>
            <input type="number" id="minutes" value="60">
        </div>

        <button id="calculateButton">CALCULATE THE DAMAGE</button>

        <div class="result-box">
            <span>THIS MEETING COST</span>
            <h2 id="result">$0.00</h2>
            <p id="verdict">Your shareholders thank you.</p>
        </div>

    </main>

<footer>
    Built with questionable financial priorities ☕️
</footer>

<script src="script.js"></script>

</body>

</html>
